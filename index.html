	<head>
		<title>Anirban Mukhopadhyay | Science Journalist</title>
		<meta charset="utf-8" />

		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

		<link rel="stylesheet" href="assets/css/main.css?v=2.9" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<!-- Favicon -->
		<link rel="icon" type="image/png" href="images/favicon.png" />
		
		<style>
			/* ==========================================================
			   BACKGROUND OVERRIDE - RESTORED DESKTOP & MOBILE SEPARATELY
			   ========================================================== */
			body, #wrapper {
				background-color: #000000 !important; 
			}

			/* Desktop Background (Landscape with Horizontal Pan) */
			#bg {
				position: fixed !important;
				top: 0 !important;
				left: 0 !important;
				width: 100vw !important; 
				height: 100vh !important;
				
				transform: none !important; 
				
				background-image: url('images/bg.jpg') !important; 
				background-color: #000000 !important; 
				
				background-size: auto 100% !important; 
				background-repeat: no-repeat !important;
				
				animation: panAndStop 12s ease-out forwards !important;
			}

			@keyframes panAndStop {
				0% { background-position: left center; }
				100% { background-position: right center; }
			}

			/* ==========================================================
			   TYPOGRAPHY OVERRIDES
			   ========================================================== */
			#header p b {
				font-weight: 700 !important;
				color: #ffffff;
			}

			/* ==========================================================
			   PUBLICATION ICONS - SIZING & SPACING
			   ========================================================== */
			#header nav a.custom-logo:before {
				display: none !important; 
			}
			
			#header nav a.custom-logo {
				position: relative;
				z-index: 1000;
				display: inline-block;
				border-bottom: none !important;
				-webkit-tap-highlight-color: transparent; 
			}

			#header nav li {
				overflow: visible !important;
			}

			#header nav a.custom-logo img {
				height: 3.85em; 
				width: 3.85em;   
				object-fit: contain; 
				background-color: rgba(255, 255, 255, 0.8); 
				border-radius: 50%;
				padding: 3px; 
				transition: all 0.2s ease-in-out;
				vertical-align: middle; 
			}

			#header nav a.custom-logo:hover,
			#header nav a.custom-logo:active,
			#header nav a.custom-logo:focus {
				font-size: 1em !important; 
			}

			/* Base styling for tooltips */
			#header nav a.custom-logo::after,
			.social-badge::after {
				content: attr(data-label) !important; 
				position: absolute !important;
				top: 100% !important; 
				bottom: auto !important; 
				left: 50% !important;
				transform: translate(-50%, -10px) !important; 
				height: auto !important; 
				width: auto !important;
				color: rgba(255, 255, 255, 0.95) !important;
				font-size: 0.7rem !important;
				font-weight: 600 !important;
				line-height: 1 !important;
				letter-spacing: 0.05em !important;
				white-space: nowrap !important;
				background: rgba(0, 0, 0, 0.75) !important; 
				padding: 6px 12px !important;
				border-radius: 12px !important;
				opacity: 0 !important;
				visibility: hidden !important;
				transition: all 0.25s ease !important;
				pointer-events: none !important; 
				box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
				margin-top: 15px !important; 
			}
			
			/* ==========================================================
			   HOVER EFFECTS (Desktops/Mice only)
			   ========================================================== */
			@media (hover: hover) and (pointer: fine) {
				#header nav a.custom-logo:hover img {
					transform: scale(1.15);
					background-color: #ffffff;
				}

				#header nav a.custom-logo:hover::after,
				.social-badge:hover::after {
					opacity: 1 !important;
					visibility: visible !important;
					transform: translate(-50%, 5px) !important; 
				}

				.social-badge:hover {
					background: rgba(255, 255, 255, 0.2);
					border-color: rgba(255, 255, 255, 0.8);
					transform: translateY(-3px) scale(1.1);
				}

				.contact-btn:hover {
					background: rgba(255, 255, 255, 0.15); 
					border-color: rgba(255, 255, 255, 0.8);
					transform: translateY(-2px);
				}
			}

			/* ==========================================================
			   ACTIVE EFFECTS (Mobile Taps)
			   ========================================================== */
			#header nav a.custom-logo:active img {
				transform: scale(1.15);
				background-color: #ffffff;
			}

			.social-badge:active {
				background: rgba(255, 255, 255, 0.2);
				border-color: rgba(255, 255, 255, 0.8);
				transform: translateY(-3px) scale(1.1);
			}

			.contact-btn:active {
				background: rgba(255, 255, 255, 0.15); 
				border-color: rgba(255, 255, 255, 0.8);
				transform: translateY(-2px);
			}

			/* ==========================================================
			   MODERN HEADSHOT WITH SATELLITE BADGES
			   ========================================================== */
			.headshot-wrapper {
				position: relative;
				display: inline-block;
				margin-bottom: 1.5rem;
			}

			#header .headshot {
				margin-bottom: 0;
			}
			
			#header .headshot img {
				width: 150px;
				height: 150px;
				object-fit: cover;
				border-radius: 50%; 
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); 
				background: rgba(255, 255, 255, 0.03); 
				backdrop-filter: blur(4px) saturate(120%); 
				-webkit-backdrop-filter: blur(4px) saturate(120%); 
				opacity: 0.95;
				transition: all 0.25s ease;
			}
			
			#header .headshot img:hover {
				opacity: 1;
				backdrop-filter: blur(0px); 
				-webkit-backdrop-filter: blur(0px);
			}

			.social-badge {
				position: absolute;
				bottom: 5%;
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.65);
				backdrop-filter: blur(6px) saturate(120%);
				-webkit-backdrop-filter: blur(6px) saturate(120%);
				border: 1px solid rgba(255, 255, 255, 0.25);
				display: flex;
				align-items: center;
				justify-content: center;
				color: #fff !important;
				text-decoration: none !important;
				transition: all 0.3s ease;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
				z-index: 20;
				-webkit-tap-highlight-color: transparent;
			}

			.badge-scholar { left: -10px; }
			.badge-linkedin { right: -10px; }

			.social-badge svg {
				width: 18px;
				height: 18px;
				fill: currentColor;
			}

			/* ==========================================================
			   CONTACT BUTTON
			   ========================================================== */
			.contact-btn {
				position: absolute;
				top: 30px;
				left: 40px;
				z-index: 1000;
				padding: 8px 24px;
				border-radius: 30px; 
				border: 1px solid rgba(255, 255, 255, 0.3); 
				background: rgba(255, 255, 255, 0.05); 
				backdrop-filter: blur(4px) saturate(120%);
				-webkit-backdrop-filter: blur(4px) saturate(120%);
				color: #ffffff !important;
				font-size: 0.75rem;
				font-weight: 600;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				text-decoration: none !important;
				cursor: pointer;
				transition: all 0.3s ease;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
				-webkit-tap-highlight-color: transparent;
			}

			/* ==========================================================
			   TOAST NOTIFICATION
			   ========================================================== */
			#toast-notification {
				position: absolute;
				top: 78px; 
				left: 40px; 
				background: rgba(20, 20, 20, 0.95);
				color: #fff;
				padding: 10px 18px;
				border-radius: 16px; 
				font-family: 'Source Sans Pro', sans-serif;
				font-size: 0.8rem;
				font-weight: 600;
				letter-spacing: 0.05em;
				display: flex;
				align-items: center;
				gap: 10px;
				box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.1);
				opacity: 0;
				visibility: hidden;
				transform: translateY(-10px);
				transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
				z-index: 10000;
			}

			#toast-notification::before {
				content: '';
				position: absolute;
				top: -6px;
				left: 25px; 
				width: 0;
				height: 0;
				border-left: 6px solid transparent;
				border-right: 6px solid transparent;
				border-bottom: 6px solid rgba(20, 20, 20, 0.95);
			}

			#toast-notification.show {
				opacity: 1;
				visibility: visible;
				transform: translateY(0);
			}

			.toast-tick {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 18px;
				height: 18px;
				background-color: #4CAF50; 
				border-radius: 50%;
			}
			
			.toast-tick svg {
				width: 10px;
				height: 10px;
			}

			#main {
				position: relative !important;
				z-index: 10 !important;
			}

			/* ==========================================================
			   RESPONSIVE DESIGN 
			   ========================================================== */
			@media screen and (max-width: 1024px) {
				#header .headshot img {
					width: 115px; 
					height: 115px;
				}
				.social-badge {
					width: 34px;
					height: 34px;
				}
			}

			@media screen and (max-width: 736px) {
				/* ----------------------------------------------------
				   MOBILE BACKGROUND OVERRIDE (Reliable Background-Position Pan)
				   ---------------------------------------------------- */
				#bg {
					background-image: url('images/bgm.png') !important; 
					/* Make the image height larger than the viewport so it has vertical room to scroll */
					background-size: auto 135vh !important; 
					width: 100vw !important;
					height: 100vh !important;
					transform: none !important;
					
					animation: panMobile 15s ease-out forwards !important;
				}

				#header .headshot img {
					width: 100px;
					height: 100px;
				}
				
				.social-badge {
					width: 32px;
					height: 32px;
					bottom: 0;
				}
				.badge-scholar { left: -5px; }
				.badge-linkedin { right: -5px; }
				
				#header p {
					padding: 0 10px;
				}

				#header nav a.custom-logo img {
					height: 4.8em !important; 
					width: 4.8em !important;
				}

				#header nav a.custom-logo::after,
				.social-badge::after {
					display: none !important;
				}

				.contact-btn {
					top: 20px;
					left: 20px;
					padding: 6px 16px;
					font-size: 0.65rem;
				}
				
				#toast-notification {
					top: 60px; 
					left: 20px;
					padding: 8px 14px;
					font-size: 0.75rem;
				}
				
				#toast-notification::before {
					left: 20px; 
				}
			}

			/* ----------------------------------------------------
			   THE MOBILE TOP-TO-BOTTOM PANNING KEYFRAMES
			   ---------------------------------------------------- */
			@keyframes panMobile {
				0% { background-position: center top; }
				100% { background-position: center bottom; } 
			}

		</style>
	</head>

		<!-- Scripts -->
		<script>
			window.onload = function() { document.body.classList.remove('is-preload'); }
			window.ontouchmove = function() { return false; }
			window.onorientationchange = function() { document.body.scrollTop = 0; }

			/* ==========================================================
			   BFCache Fix: Cleanly clear focus to prevent sticky hovers
			   ========================================================== */
			window.addEventListener('pageshow', function (event) {
				if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
					document.body.style.pointerEvents = 'none';
					window.requestAnimationFrame(function() {
						document.body.style.pointerEvents = 'auto';
					});
					document.querySelectorAll('a').forEach(function(link) {
						link.blur();
						link.classList.remove('active');
					});
				}
			});

			/* ==========================================================
			   COPY TO CLIPBOARD & TOAST NOTIFICATION SCRIPT
			   ========================================================== */
			document.getElementById('contactBtn').addEventListener('click', function(e) {
				const emailToCopy = "anir.deskspace@gmail.com"; 

				navigator.clipboard.writeText(emailToCopy).then(function() {
					const toast = document.getElementById('toast-notification');
					toast.classList.add('show');
					
					setTimeout(function() {
						toast.classList.remove('show');
					}, 3500); 

				}).catch(function(err) {
					console.error('Could not copy text: ', err);
				});
			});
		</script>
